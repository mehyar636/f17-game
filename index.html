<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#050810">
  <title>F17 Pro — Football Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #050810;
      overflow: hidden;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }
    #game-container { width: 100%; height: 100%; position: relative; z-index: 1; }
    #view3d { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; display: none; }
    #game-container canvas { display: block; }
    /* phones held upright: the pitch needs landscape, so ask for a turn instead of showing a tiny strip */
    #rotate { display: none; position: fixed; inset: 0; z-index: 10; background: #050810; color: #fff;
      flex-direction: column; align-items: center; justify-content: center; gap: 28px; text-align: center;
      font-family: 'Barlow Condensed', system-ui, sans-serif; }
    #rotate .phone { width: 74px; height: 128px; border: 5px solid #facc15; border-radius: 14px; position: relative;
      animation: turn 2.2s ease-in-out infinite; }
    #rotate .phone::after { content: ''; position: absolute; left: 50%; bottom: 7px; width: 22px; height: 4px; margin-left: -11px; border-radius: 2px; background: #facc15; }
    #rotate b { font-size: 30px; letter-spacing: 2px; font-weight: 800; }
    #rotate span { font-family: 'Barlow', system-ui, sans-serif; font-size: 14px; letter-spacing: 3px; color: rgba(255,255,255,0.6); }
    @keyframes turn { 0%, 20% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
    @media (orientation: portrait) and (max-width: 820px) { #rotate { display: flex; } }
    /* full-time dim for the strips beside the 16:9 HUD on wide screens */
    .side-dim { position: fixed; top: 0; bottom: 0; z-index: 2; background: rgba(0,0,0,0.78); pointer-events: none; opacity: 0; transition: opacity .5s; }
  </style>
</head>
<body>
  <canvas id="view3d"></canvas>
  <div id="game-container"></div>
  <div id="rotate"><div class="phone"></div><b>TURN YOUR PHONE SIDEWAYS</b><span>F17 PLAYS IN LANDSCAPE</span></div>
  <script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
  <script src="game/state.js"></script>
  <script src="game/scenes/BootScene.js"></script>
  <script type="module" src="game/main.js"></script>
</body>
</html>
